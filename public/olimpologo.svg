<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Olimpo Gym">
  <title>Olimpo Gym</title>
  <defs>
    <linearGradient id="og-verde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1fd677"/>
      <stop offset="100%" stop-color="#009b4e"/>
    </linearGradient>
  </defs>
  <!-- Frontón del templo (blanco, hace de "cima del Olimpo") -->
