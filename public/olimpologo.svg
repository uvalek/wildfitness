  <!-- Arquitrabe -->
  <rect x="6" y="27" width="52" height="5" rx="1.6" fill="url(#og-verde)"/>
  <!-- Columnas dóricas -->
  <rect x="11" y="34.5" width="8" height="18" rx="1.6" fill="url(#og-verde)"/>
  <rect x="28" y="34.5" width="8" height="18" rx="1.6" fill="url(#og-verde)"/>
  <rect x="45" y="34.5" width="8" height="18" rx="1.6" fill="url(#og-verde)"/>
  <!-- Estilóbato (base) -->
  <rect x="2.5" y="55" width="59" height="6" rx="2" fill="url(#og-verde)"/>
